name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  analyze-test-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: stable
          cache: true
      - name: Generate platform shells
        run: flutter create --platforms=android,ios --org ai.eburon --project-name eburon_hub --no-pub .
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Build Android debug APK
        run: flutter build apk --debug
      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: eburon-hub-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  ios-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: stable
          cache: true
      - name: Generate platform shells
        run: flutter create --platforms=android,ios --org ai.eburon --project-name eburon_hub --no-pub .
      - run: flutter pub get
      - name: Build iOS without signing
        run: flutter build ios --debug --no-codesign
      - name: Upload iOS no-sign app
        uses: actions/upload-artifact@v4
        with:
          name: eburon-hub-ios-debug-nosign
          path: build/ios/iphoneos/Runner.app
          if-no-files-found: error
          retention-days: 14
