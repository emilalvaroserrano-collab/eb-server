name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  analyze-test-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: stable
          cache: true
      - name: Generate platform shells
        run: flutter create --platforms=android,ios --org ai.eburon --project-name eburon_hub --no-pub .
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Build Android debug APK
        run: flutter build apk --debug
      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: eburon-hub-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Package APK for repository
        if: github.event_name == 'push' && !contains(github.event.head_commit.message, '[skip apk]')
        run: |
          mkdir -p releases
          cd build/app/outputs/flutter-apk
          zip -9 "$GITHUB_WORKSPACE/releases/Eburon-Hub-debug-apk.zip" app-debug.apk
      - name: Commit APK archive to main
        if: github.event_name == 'push' && !contains(github.event.head_commit.message, '[skip apk]')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases/Eburon-Hub-debug-apk.zip
          git commit -m "build: add Eburon Hub debug APK archive [skip apk]"
          git push origin HEAD:main

  ios-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: stable
          cache: true
      - name: Generate platform shells
        run: flutter create --platforms=android,ios --org ai.eburon --project-name eburon_hub --no-pub .
      - run: flutter pub get
      - name: Build iOS without signing
        run: flutter build ios --debug --no-codesign
      - name: Upload iOS no-sign app
        uses: actions/upload-artifact@v4
        with:
          name: eburon-hub-ios-debug-nosign
          path: build/ios/iphoneos/Runner.app
          if-no-files-found: error
          retention-days: 14
