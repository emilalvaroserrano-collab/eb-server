name: eburon_hub
description: Offline-first local AI runtime and OpenAI-compatible mobile server for Android and iOS.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.9.0 <4.0.0"
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  shared_preferences: ^2.5.3
  file_picker: ^10.3.2
  path_provider: ^2.1.5
  path: ^1.9.1
  archive: ^4.0.7
  crypto: ^3.0.6
  uuid: ^4.5.1
  permission_handler: ^12.0.1
  device_info_plus: ^11.5.0
  network_info_plus: ^6.1.4


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
